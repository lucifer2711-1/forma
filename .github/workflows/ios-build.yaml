name: iOS Build

# Public repo => unlimited free macOS minutes. Only build iOS on main and
# release tags — PRs run the cheap Linux CI instead (cicd.md §6).
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Package as an IPA layout so Sideloadly can resign + install it.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry forma-unsigned.ipa Payload

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: forma-ios-build
          path: build/ios/iphoneos
          retention-days: 14

      - name: Upload Sideloadly-ready IPA
        uses: actions/upload-artifact@v4
        with:
          name: forma-unsigned-ipa
          path: build/ipa/forma-unsigned.ipa
          retention-days: 14
