name: iOS Build

# Public repo => unlimited free macOS minutes. Only build iOS on main and
# release tags — PRs run the cheap Linux CI instead (cicd.md §6).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # The test device runs official iOS 27; build against the iOS 27 SDK
    # via the xcode-27 preview image. Falls back to macos-26 (Xcode 26.6,
    # iOS 26.5 SDK) if Flutter/Xcode 27 proves incompatible.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 27 SDK when available)
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # Every artifact is named for the build it contains, so a stale IPA
      # can never be sideloaded by mistake again (device-test finding
      # 2026-09-17: an old build was reinstalled while the fixes were
      # already in CI, and the device kept failing as if nothing changed).
      - name: Read build version
        id: version
        run: |
          STAMP=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$STAMP" | tr '+' '-')" >> "$GITHUB_OUTPUT"
          echo "Building version $STAMP"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FORMA_BUILD=${{ steps.version.outputs.stamp }}

      # Package as an IPA layout so Sideloadly can resign + install it.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry "forma-${{ steps.version.outputs.slug }}-unsigned.ipa" Payload
          ls -la

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: forma-ios-build-${{ steps.version.outputs.slug }}
          path: build/ios/iphoneos
          retention-days: 14

      - name: Upload Sideloadly-ready IPA
        uses: actions/upload-artifact@v4
        with:
          name: forma-${{ steps.version.outputs.slug }}-ipa
          path: build/ipa/forma-${{ steps.version.outputs.slug }}-unsigned.ipa
          retention-days: 14
