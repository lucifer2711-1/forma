name: iOS Build

# Public repo => unlimited free macOS minutes. Only build iOS on main and
# release tags — PRs run the cheap Linux CI instead (cicd.md §6).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # macos-14 is deprecated and ships a pre-iOS-27 SDK; the test device
    # runs official iOS 27, so build against the newest SDK available
    # (device test 2026-09-17: tracking never locked on an old-SDK build).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 27 SDK when available)
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Package as an IPA layout so Sideloadly can resign + install it.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry forma-unsigned.ipa Payload

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: forma-ios-build
          path: build/ios/iphoneos
          retention-days: 14

      - name: Upload Sideloadly-ready IPA
        uses: actions/upload-artifact@v4
        with:
          name: forma-unsigned-ipa
          path: build/ipa/forma-unsigned.ipa
          retention-days: 14
